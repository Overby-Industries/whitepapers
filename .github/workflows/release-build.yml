name: Release White Paper PDFs

on:
  push:
    tags:
      - 'v*'   # Runs when you push a tag like v1.0, v2.0, etc.

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install LaTeX
      # NOTE: texlive-full (~6-8GB) previously used here regularly ran the
      # GitHub-hosted runner low on disk during the first real compile. We
      # only use a handful of packages, so install a targeted scheme instead.
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk

      # Build PDFs
      - name: Build PDFs
        run: |
          mkdir -p build
          shopt -s nullglob globstar
          files=(papers/**/*.tex)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No published papers under papers/ yet — nothing to release."
            exit 1
          fi
          for f in "${files[@]}"; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build "$f"
          done
          ls -l build

      - name: Show LaTeX logs on failure
        if: failure()
        run: |
          for log in build/*.log; do
            echo "===== $log ====="
            cat "$log"
          done

      # Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
