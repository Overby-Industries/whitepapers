name: Build White Papers

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Install LaTeX
      - name: Install TeX Live & latexmk
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full latexmk

      # Step 3: Build PDFs from .tex sources in papers/ and drafts/
      - name: Build PDF(s)
        run: |
          mkdir -p dist
          shopt -s nullglob globstar
          files=(papers/**/*.tex drafts/**/*.tex)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .tex sources found under papers/ or drafts/ yet — nothing to build."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Building $f..."
            latexmk -pdf -interaction=nonstopmode -outdir=dist "$f"
          done

      # Step 4: Commit PDFs back into repo (push events only)
      - name: Commit built PDFs
        if: github.event_name == 'push'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/*.pdf 2>/dev/null || true
          git commit -m "Automated PDF build from LaTeX" || echo "No changes to commit"
          git push
